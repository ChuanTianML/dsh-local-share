name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_COMMIT: b830ec950faba0a46dda564be3e2d854afed94f1

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.22.0, 24.15.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check out verified DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .sandbox/harness
          git -C .sandbox/harness checkout "$DSH_COMMIT"
      - name: Build verified DeepSeek Harness
        run: |
          pnpm --dir .sandbox/harness install --frozen-lockfile
          pnpm --dir .sandbox/harness run build
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
